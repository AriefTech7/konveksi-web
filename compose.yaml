services:
    app-konveksi-web:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                UID: ${UID:-1000}
                GID: ${GID:-1000}
        container_name: app-konveksi-web
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
            - laravel_vendor_packages:/var/www/html/vendor
        networks:
            - laravel
        depends_on:
            db-konveksi-web:
                condition: service_healthy
    nginx-konveksi-web:
        image: nginx:1.30-alpine3.24-slim
        container_name: nginx-konveksi-web
        ports:
            - "${APP_PORT:-8080}:80"
        volumes:
            - .:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        networks:
            - laravel
        depends_on:
            - app-konveksi-web
    db-konveksi-web:
        image: mysql:8.4
        container_name: db-konveksi-web
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-laravel}
            MYSQL_USER: ${DB_USERNAME:-laravel}
            MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
        networks:
            - laravel
        ports:
            - "${DB_PORT:-3307}:3306"
        healthcheck:
            test:
                [
                    "CMD",
                    "mysqladmin",
                    "ping",
                    "-h",
                    "localhost",
                    "-u",
                    "root",
                    "-p${DB_PASSWORD:-root}"
                ]
            interval: 5s
            timeout: 5s
            retries: 20
        volumes:
            - laravel_db_data:/var/lib/mysql
    node-konveksi-web:
        image: node:22.23-alpine
        container_name: node-konveksi-web
        working_dir: /var/www/html
        ports:
            - "${VITE_PORT:-5173}:5173"
        volumes:
            - .:/var/www/html
            - laravel_node_modules:/var/www/html/node_modules
        command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
        networks:
            - laravel

networks:
    laravel:

# menentukan nama volume berdasarkan yang ada di setiap service
volumes:
    laravel_vendor_packages:
    laravel_node_modules:
    laravel_db_data:
